<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Ember — Act I</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap">
<style>:root{--void:#04060A;--rule:#1A2130;--bone:#E6E2D8;--bone-dim:#A9A498;--ice:#8FA8C4;--ice-dim:#647C99;--ember:#E8703A;--display:"Fraunces",Georgia,serif;--body:"IBM Plex Sans",Arial,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace;--gutter:64px;--ease:cubic-bezier(.22,.61,.36,1)}*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--void);color:var(--bone);font-family:var(--body);font-weight:300;overscroll-behavior-y:none}html{scrollbar-width:none}html::-webkit-scrollbar{display:none}canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}#earth{z-index:1}#over{z-index:2;pointer-events:none}.mono{font:400 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ice-dim)}#head{position:fixed;z-index:4;left:var(--gutter);top:30px;pointer-events:none}#head .ti{font:400 15px var(--display);color:var(--bone-dim);margin-top:6px}#copy{position:fixed;z-index:3;left:var(--gutter);bottom:148px;width:min(39vw,560px);pointer-events:none}#voice{font:300 clamp(29px,3.1vw,46px)/1.14 var(--display);letter-spacing:-.015em;max-width:24ch;opacity:0;transition:opacity .65s var(--ease)}#voice.on{opacity:1}#state{position:fixed;z-index:3;left:var(--gutter);bottom:111px;pointer-events:none;font-variant-numeric:tabular-nums}#ruler{position:fixed;z-index:4;left:var(--gutter);right:var(--gutter);bottom:28px;height:48px;pointer-events:none}#ruler .line{height:1px;background:var(--rule);position:absolute;left:0;right:0;top:5px}.tick{position:absolute;top:0;height:15px;border-left:1px solid var(--ice-dim)}.tick i{position:absolute;top:19px;left:-1px;white-space:nowrap;font:400 9px var(--mono);letter-spacing:.08em;color:var(--ice-dim);font-style:normal}.tick.hot{border-color:var(--bone)}.tick.hot i{color:var(--bone)}#hint{position:fixed;z-index:5;right:22px;bottom:28px}#panel{position:fixed;z-index:40;right:22px;top:22px;width:370px;display:none;background:rgba(6,9,15,.96);border:1px solid var(--rule);padding:15px 16px;font:400 10.5px/1.7 var(--mono);color:var(--ice-dim)}#panel.on{display:block}#panel .r{display:flex;justify-content:space-between;gap:14px}#panel b{color:var(--bone);font-weight:500;text-align:right}button{width:100%;margin-top:8px;padding:7px;background:transparent;border:1px solid #2A3344;color:var(--ice);font:inherit;cursor:pointer}pre{white-space:pre-wrap;color:var(--bone-dim);margin-top:7px}.ok{color:#7FBF8F}.bad{color:var(--ember)}#load{position:fixed;inset:0;z-index:20;background:var(--void);display:grid;place-content:center;justify-items:center;gap:22px;transition:opacity .7s var(--ease)}#load.off{opacity:0;pointer-events:none}#load .bar{width:240px;height:1px;background:var(--rule)}#load i{display:block;width:0;height:100%;background:var(--ice-dim);transition:width .3s linear}#runway{height:1200vh}</style>
</head><body>
<canvas id="earth"></canvas><canvas id="over"></canvas><div id="head"><div id="kicker" class="mono">ACT I</div><div id="title" class="ti">—</div></div><div id="copy"><div id="voice"></div></div><div id="state" class="mono"></div><div id="ruler"><div class="line"></div><span class="tick" style="left:0%"><i id="start">—</i></span><span class="tick hot" style="left:100%"><i id="end" style="transform:translateX(-100%)">—</i></span></div><div id="hint" class="mono">press i</div><div id="panel"><div class="r"><span>t · year BP</span><b id="p-time">—</b></div><div class="r"><span>sea level</span><b id="p-sea">—</b></div><div class="r"><span>ice atlas</span><b id="p-ice">—</b></div><div class="r"><span>camera</span><b id="p-cam">—</b></div><div class="r"><span>focus</span><b id="p-light">—</b></div><button id="t-purity">Run purity test</button><pre id="o-purity">One state from one t.</pre></div><div id="load"><div class="mono">ONE EMBER · ACT I</div><div class="bar"><i id="lbar"></i></div><div class="mono" id="lmsg">reading the earth</div></div><div id="runway"></div>
<script>var n=Math.max(1,Math.min(4,parseInt(new URLSearchParams(location.search).get("beat")||"1",10))),B={1:[300000,260000,"The dark earth"],2:[260000,200000,"Shimmer"],3:[200000,76000,"The failed doors"],4:[76000,60000,"Toba"]}[n];window.EMBER_CONFIG={id:n,data:"data/beat"+("0"+n).slice(-2)+".json",years:B.slice(0,2)};document.getElementById("title").textContent=B[2];document.getElementById("kicker").textContent="BEAT "+("0"+n).slice(-2)+" · ACT I";document.getElementById("start").textContent=(B[0]/1000)+" KA";document.getElementById("end").textContent=(B[1]/1000)+" KA";</script><script src="../doors/doors.js"></script>
</body></html>
