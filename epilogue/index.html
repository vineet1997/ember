e);font:inherit}pre{white-space:pre-wrap;margin-top:7px}#load{position:fixed;inset:0;z-index:20;background:var(--void);display:grid;place-content:center;gap:18px;transition:opacity .7s}#load.off{opacity:0;pointer-events:none}.bar{width:220px;height:1px;background:var(--rule)}.bar i{display:block;width:55%;height:100%;background:var(--iced)}#runway{height:1600vh}</style></head><body><canvas id="earth"></canvas><canvas id="over"></canvas><div id="head"><div class="mono">Beat 14 · Act IV · 800 BP — present</div><div class="ti">The human web</div></div><div id="copy"><div id="voice"></div></div><div id="state"></div><div id="ruler"><span>800 BP</span><span>500 years of forced movement</span><span>now</span></div><div id="hint" class="mono">press i</div><div id="panel"><div>Beat 14 — the fan is a diagram of overlapping ancestry, not a route map or a single family line.</div><button id="t-purity">Run purity test</button><pre id="o-purity"></pre><div id="p-time"></div><div id="p-sea"></div><div id="p-ice"></div><div id="p-cam"></div><div id="p-light"></div></div><div id="load"><div class="mono">One Ember · Beat 14</div><div class="bar"><i id="lbar"></i></div><div class="mono" id="lmsg">reading the earth</div></div><div id="runway"></div><script>window.EMBER_CONFIG={id:14,data:"data/beat14.json",years:[800,0],cams:[[0,-22,24,5.1,3,125],[.55,8,18,7,2,150],[1,14,12,9,1,165]]};</script><script src="../doors/doors.js"></script></body></html>
