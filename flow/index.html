<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Ember — deep-time run, 39,000–5,000 BP</title>
<style>
:root{--void:#04060a;--rule:#1a2130;--ice:#8fa8c4;--ice-dim:#647c99;--bone:#e6e2d8;--display:Fraunces,Georgia,serif;--mono:"IBM Plex Mono",Consolas,monospace;--gutter:64px}*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--void);overscroll-behavior-y:none;scrollbar-width:none}html::-webkit-scrollbar{display:none}#stack{position:fixed;inset:0;overflow:hidden}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--void);opacity:0;visibility:hidden;pointer-events:none;transition:opacity 80ms linear}iframe.on{opacity:1;visibility:visible}#head{position:fixed;z-index:10;top:30px;left:var(--gutter);pointer-events:none}#act{display:block;color:var(--ice-dim);font:400 10px var(--mono);letter-spacing:.16em;text-transform:uppercase}#title{display:block;margin-top:6px;color:var(--bone);font:400 15px var(--display)}#subtitle{position:fixed;z-index:10;left:var(--gutter);bottom:142px;width:min(41vw,570px);color:var(--bone);font:300 clamp(25px,2.75vw,42px)/1.16 var(--display);letter-spacing:-.012em;opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s;pointer-events:none}#subtitle.on{opacity:1;transform:none}#ruler{position:fixed;z-index:10;left:var(--gutter);right:var(--gutter);bottom:28px;height:48px;pointer-events:none}.line{position:absolute;left:0;right:0;top:5px;height:1px;background:var(--rule)}.tick{position:absolute;top:0;height:15px;border-left:1px solid var(--ice-dim)}.tick i{position:absolute;top:19px;left:-1px;white-space:nowrap;color:var(--ice-dim);font:400 9px var(--mono);font-style:normal;letter-spacing:.08em}.tick.hot{border-color:var(--bone)}.tick.hot i{color:var(--bone)}#load{position:fixed;inset:0;z-index:20;display:grid;place-content:center;gap:16px;background:var(--void);color:var(--ice);font:400 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;transition:opacity .4s}#load.off{opacity:0;pointer-events:none}.bar{height:1px;width:220px;background:var(--rule)}.bar i{display:block;width:0;height:100%;background:var(--ice);transition:width .2s}#panel{position:fixed;right:20px;top:20px;z-index:30;display:none;width:300px;padding:13px 14px;background:rgba(4,6,10,.94);border:1px solid var(--rule);color:var(--ice);font:400 10px/1.65 var(--mono);letter-spacing:.08em;text-transform:uppercase}html.debug #panel.on{display:block}#panel b{color:var(--bone);font-weight:400;float:right}#runway{height:1000vh}
</style>
</head>
<body>
<div id="stack" aria-live="off"></div>
<div id="load"><span>ONE EMBER · CONTINUOUS DEEP TIME</span><div class="bar"><i id="bar"></i></div><span id="status">reading beats 08–12</span></div>
<div id="head"><span id="act">—</span><span id="title">—</span></div>
<div id="subtitle" role="status" aria-live="polite"></div>
<div id="ruler" aria-hidden="true"><div class="line"></div><div id="ticks"></div></div>
<div id="panel"><div>global t <b id="p-t">—</b></div><div>beat <b id="p-beat">—</b></div><div>local t <b id="p-local">—</b></div><div>year BP <b id="p-year">—</b></div></div>
<div id="runway" aria-hidden="true"></div>
<script src="flow.js"></script>
</body>
</html>
