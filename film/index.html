<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Ember</title><style>:root{--void:#04060a;--rule:#1a2130;--ice:#8fa8c4;--iced:#647c99;--bone:#e6e2d8;--display:Fraunces,Georgia,serif;--mono:"IBM Plex Mono",Consolas,monospace;--gutter:64px}*{box-sizing:border-box;margin:0}html,body{background:var(--void);overscroll-behavior-y:none;scrollbar-width:none}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--void);opacity:0;visibility:hidden;pointer-events:none}iframe.on{opacity:1;visibility:visible}#stack{position:fixed;inset:0;overflow:hidden}#input{position:fixed;inset:0;z-index:1;touch-action:none;outline:0}#head,#subtitle,#ruler{position:fixed;z-index:10;pointer-events:none}#head{top:30px;left:var(--gutter)}#act{display:block;color:var(--iced);font:400 10px var(--mono);letter-spacing:.16em;text-transform:uppercase}#title{display:block;margin-top:6px;color:var(--bone);font:400 15px var(--display)}#subtitle{left:var(--gutter);bottom:142px;width:min(41vw,570px);color:var(--bone);font:300 clamp(25px,2.75vw,42px)/1.16 var(--display);letter-spacing:-.012em;opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}#subtitle.on{opacity:1;transform:none}#ruler{left:var(--gutter);right:var(--gutter);bottom:28px;height:48px;border-top:1px solid var(--rule)}#progress{position:absolute;top:-1px;left:0;height:1px;width:0;background:var(--bone);transition:width .08s linear}.tick{position:absolute;top:-1px;height:15px;border-left:1px solid var(--iced)}.tick i{position:absolute;top:19px;left:-1px;white-space:nowrap;color:var(--iced);font:400 9px var(--mono);font-style:normal;letter-spacing:.08em}.hot{border-color:var(--bone)}.hot i{color:var(--bone)}#load{position:fixed;inset:0;z-index:20;display:grid;place-content:center;gap:16px;background:var(--void);color:var(--ice);font:400 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;transition:opacity .4s}#load.off{opacity:0;pointer-events:none}.bar{height:1px;width:220px;background:var(--rule)}.bar i{display:block;width:0;height:100%;background:var(--ice);transition:width .2s}#runway{height:900vh}</style></head><body><div id="stack"></div><div id="input" tabindex="-1" aria-label="Film scroll control"></div><div id="load"><span>One Ember · continuous deep time</span><div class="bar"><i id="bar"></i></div><span id="status">reading fourteen beats</span></div><div id="head"><span id="act">—</span><span id="title">—</span></div><div id="subtitle" role="status" aria-live="polite"></div><div id="ruler" aria-hidden="true"><i id="progress"></i><div id="ticks"></div></div><div id="runway" aria-hidden="true"></div><script src="film.js"></script></body></html>
